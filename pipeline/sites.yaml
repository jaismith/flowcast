# flowcast v2 site registry. One entry per forecast site.
# Thresholds come from the NWPS gauge API (https://api.water.noaa.gov/nwps/v1/gauges/<nws_lid>).
sites:
  - id: USGS-01427510
    name: Delaware River at Callicoon, NY
    timezone: America/New_York
    variables: [discharge, water_temperature]
    nws_lid: CCRN6
    nwm_reach: 2617456
    stage_thresholds_ft:
      action: 9.0
      minor: 12.0
      moderate: 13.0
      major: 14.8
    # Real-time gauges directly below upstream NYC reservoirs (optional regulation inputs).
    regulation_gauges:
      - USGS-01425000 # West Branch Delaware at Stilesville (below Cannonsville)
      - USGS-01417000 # East Branch Delaware at Downsville (below Pepacton)
    # Gauged inflows upstream of the site, used by the routing/ARX/boosted-tree baselines.
    upstream_gauges:
      - USGS-01427207 # Delaware River at Lordville (mainstem, ~15 mi upstream)
      - USGS-01426500 # West Branch at Hale Eddy
      - USGS-01421000 # East Branch at Fishs Eddy (discontinued Dec 2025)
      - USGS-01420500 # Beaver Kill at Cooks Falls
      - USGS-01417500 # East Branch at Harvard
      - USGS-01423000 # West Branch at Walton (above Cannonsville)

# Gauges ingested hourly besides the sites and their regulation gauges: the Upper Delaware network,
# i.e. the NWS forecast points the archiver benchmarks, plus tributaries above the reservoirs.
# The hourly ingest pulls discharge, water temperature and stage for every gauge listed in this file.
gauges:
  - {id: USGS-01413500, name: East Branch Delaware River at Margaretville, NY}
  - {id: USGS-01417500, name: East Branch Delaware River at Harvard, NY}
  - {id: USGS-01420500, name: Beaver Kill at Cooks Falls, NY}
  - {id: USGS-01421000, name: East Branch Delaware River at Fishs Eddy, NY}
  - {id: USGS-01421500, name: East Branch Delaware River at Hancock, NY}
  - {id: USGS-01423000, name: West Branch Delaware River at Walton, NY}
  - {id: USGS-01426500, name: West Branch Delaware River at Hale Eddy, NY}
  - {id: USGS-01427207, name: Delaware River at Lordville, NY}
  - {id: USGS-01428500, name: Delaware River above Lackawaxen River near Barryville, NY}
  - {id: USGS-01431500, name: Lackawaxen River at Hawley, PA}
  - {id: USGS-01434000, name: Delaware River at Port Jervis, NY}
  - {id: USGS-01436000, name: Neversink River at Neversink, NY (below Neversink Reservoir; joins below Callicoon)}
  - {id: USGS-01436690, name: Neversink River at Bridgeville, NY}
  - {id: USGS-01437500, name: Neversink River at Godeffroy, NY}
  - {id: USGS-01438500, name: Delaware River at Montague, NJ}
