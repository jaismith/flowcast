# Water temperature v1 (rebuild plan §3): one multi-site hourly LSTM for the 126 basins with water temperature, on the
# temperature cube built from training cube v1.3 full (`flowcast-model temp-cube`, trainval only). Same model family as
# the flow model: NeuralHydrology handoff forecast LSTM, CMAL head, residual change from the last observed temperature
# (tw_c 1 h before issue), basin-mixed batches, fp32.
#
# Hindcast branch (336 h): AORC (masked in operational hindcasts; dropped 30% in training), HRRR analysis and MRMS
# (real time), lagged observed water temperature and flow, gauged dam-release flow, water temperature at the largest
# upstream gauge and at the dam-release gauges (masked where a basin has none), day-of-year and solar-hour harmonics.
# Forecast branch (180 h, so a 12Z issue reaches day 7's afternoon maximum): GEFS (GEFSv12 reforecast 2000-2019 in
# training, operational GEFS from 2020-10), flow, the release flow and release temperature held at their last values,
# and the harmonics. Flow in the forecast branch is observed future flow in training (dropped 50% of the time) and the
# streamflow model's forecast in operational hindcasts (`flowfc`, the full-v2tt 3-seed ensemble median per GEFS member).
# Missing targets are masked step by step (elementwise_mask), not per window: temperature records have many gaps.
flowcast:
  train: {amp: none, elementwise_mask: true}
  dataset:
    cube: [/opt/flowcast/data/trainval.zarr]
    optional_inputs: [hrrr_an_precip_mm_h, hrrr_an_temp_2m_c, hrrr_an_dewpoint_2m_c, hrrr_an_pressure_kpa, hrrr_an_wind_speed_10m, hrrr_an_sw_down_wm2, hrrr_an_lw_down_wm2, mrms_precip_mm_h, tw_c_shift1, qobs_mm_h_shift1, gauged_outflow_mm_h_shift1, upstream_tw_c_shift1, outflow_tw_c_shift1, qobs_mm_h, gauged_outflow_persist, outflow_tw_persist]
    group_dropout: {aorc_temp_2m_c: 0.3, tw_c_shift1: 0.25, qobs_mm_h_shift1: 0.3, upstream_tw_c_shift1: 0.3, outflow_tw_c_shift1: 0.3}
    forecast_group_dropout: {qobs_mm_h: 0.5}
    persist_inputs: {gauged_outflow_persist: gauged_outflow_mm_h_shift1, outflow_tw_persist: outflow_tw_c_shift1}
    # a cached temperature basin holds about 83 MB (62 MB of GEFS): 24-basin blocks with 4,096-sample chunks and
    # float16 forecasts keep 3 loader workers inside a 16 GB instance
    block_basins: 24
    chunk_samples: 4096
    forecast_float16: true
    forecast_latency_h: {gefs_init: 6, gefs_rf_init: 6}
    forecast_aliases: {gefs_rf_precip_mm_h: gefs_precip_mm_h, gefs_rf_temp_2m_c: gefs_temp_2m_c, gefs_rf_dewpoint_2m_c: gefs_dewpoint_2m_c, gefs_rf_pressure_kpa: gefs_pressure_kpa, gefs_rf_wind_speed_10m: gefs_wind_speed_10m, gefs_rf_sw_down_wm2: gefs_sw_down_wm2, gefs_rf_lw_down_wm2: gefs_lw_down_wm2}
  basins: all
  target: {unit: degC, variable: water_temperature, clip_min: null, daily_max: {timezone: America/New_York}}
  hindcast:
    issue_hours: [0, 6, 12, 18]
    start: "2020-10-01"
    # the USGS Delaware forecast's issue times at Lordville (local midnight; 2021 data release plus the archiver's 2022 issue)
    extra_issues: configs/lordville_usgs_issues_wy2021_2022.parquet
    n_samples: 4
    epoch: last
    resume: true
    modes:
      operational:
        suffix: ""
        run_type: operational
        mask_hindcast: [aorc_precip_mm_h, aorc_temp_2m_c, aorc_dewpoint_2m_c, aorc_pressure_kpa, aorc_wind_speed_10m, aorc_sw_down_wm2, aorc_lw_down_wm2, aorc_spfh_2m_gkg]
        substitute_forecast: {qobs_mm_h: flowfc_qobs_mm_h}
        members: [0, 1, 2, 3, 4]
      noflow:
        suffix: _noflow
        run_type: operational
        mask_hindcast: [aorc_precip_mm_h, aorc_temp_2m_c, aorc_dewpoint_2m_c, aorc_pressure_kpa, aorc_wind_speed_10m, aorc_sw_down_wm2, aorc_lw_down_wm2, aorc_spfh_2m_gkg]
        mask_forecast: [qobs_mm_h]
        members: [0, 1, 2, 3, 4]
      obsflow:
        suffix: _obsflow
        run_type: perfect_forcing
        mask_hindcast: [aorc_precip_mm_h, aorc_temp_2m_c, aorc_dewpoint_2m_c, aorc_pressure_kpa, aorc_wind_speed_10m, aorc_sw_down_wm2, aorc_lw_down_wm2, aorc_spfh_2m_gkg]
        members: [0, 1, 2, 3, 4]
  run_type: operational
  score: {enabled: false}
  model: {residual_from: tw_c_shift1, min_scale: 0.005}

experiment_name: lstm_temp_v1
dataset: flowcast_zarr

train_start_date: "01/10/2000"
train_end_date: "30/09/2019"
validation_start_date: "01/10/2019"
validation_end_date: "30/09/2022"
test_start_date: "01/10/2019"
test_end_date: "30/09/2022"

model: handoff_forecast_lstm
seq_length: 516
forecast_seq_length: 180
predict_last_n: 180
forecast_overlap: 0
hidden_size: 256
hindcast_hidden_size: 256
forecast_hidden_size: 256
state_handoff_network: {type: fc, hiddens: [256], activation: tanh, dropout: 0.0}
initial_forget_bias: 3
output_dropout: 0.3

dynamic_inputs: [aorc_precip_mm_h, aorc_temp_2m_c, aorc_dewpoint_2m_c, aorc_pressure_kpa, aorc_wind_speed_10m, aorc_sw_down_wm2, aorc_lw_down_wm2, aorc_spfh_2m_gkg, hrrr_an_precip_mm_h, hrrr_an_temp_2m_c, hrrr_an_dewpoint_2m_c, hrrr_an_pressure_kpa, hrrr_an_wind_speed_10m, hrrr_an_sw_down_wm2, hrrr_an_lw_down_wm2, mrms_precip_mm_h, tw_c_shift1, qobs_mm_h_shift1, gauged_outflow_mm_h_shift1, upstream_tw_c_shift1, outflow_tw_c_shift1, doy_sin, doy_cos, solar_sin, solar_cos, gefs_precip_mm_h, gefs_temp_2m_c, gefs_dewpoint_2m_c, gefs_pressure_kpa, gefs_wind_speed_10m, gefs_sw_down_wm2, gefs_lw_down_wm2, qobs_mm_h, gauged_outflow_persist, outflow_tw_persist]
hindcast_inputs:
  - [aorc_precip_mm_h, aorc_temp_2m_c, aorc_dewpoint_2m_c, aorc_pressure_kpa, aorc_wind_speed_10m, aorc_sw_down_wm2, aorc_lw_down_wm2, aorc_spfh_2m_gkg]
  - [hrrr_an_precip_mm_h, hrrr_an_temp_2m_c, hrrr_an_dewpoint_2m_c, hrrr_an_pressure_kpa, hrrr_an_wind_speed_10m, hrrr_an_sw_down_wm2]
  - [hrrr_an_lw_down_wm2]
  - [mrms_precip_mm_h]
  - [tw_c_shift1]
  - [qobs_mm_h_shift1]
  - [gauged_outflow_mm_h_shift1]
  - [upstream_tw_c_shift1]
  - [outflow_tw_c_shift1]
  - [doy_sin, doy_cos, solar_sin, solar_cos]
forecast_inputs:
  - [gefs_precip_mm_h, gefs_temp_2m_c, gefs_dewpoint_2m_c, gefs_pressure_kpa, gefs_wind_speed_10m, gefs_sw_down_wm2, gefs_lw_down_wm2]
  - [qobs_mm_h]
  - [gauged_outflow_persist, outflow_tw_persist]
  - [doy_sin, doy_cos, solar_sin, solar_cos]
nan_handling_method: input_replacing
lagged_features: {tw_c: 1, qobs_mm_h: 1, gauged_outflow_mm_h: 1, upstream_tw_c: 1, outflow_tw_c: 1}
static_attributes: [log_area, lat, lon, elevation_m, slope_deg, northness, eastness, sky_view, p_mean, pet_mean, aridity, p_seasonality, frac_snow, t_mean, baseflow_index, forest_frac, developed_frac, runoff_mean_mm_yr, nid_n_dams, nid_n_major, nid_normal_storage_mm, nid_dor_normal, nid_major_dor_normal, nid_largest_dor, nid_max_drainage_frac, below_dam, below_dam_drainage_frac, gauged_outflow_n, gauged_outflow_area_frac, ungauged_dor_normal, has_upstream_tw, upstream_tw_travel_time_h, upstream_tw_area_frac, has_outflow_tw, outflow_tw_n]
target_variables: [tw_c]

head: cmal
n_distributions: 3
n_samples: 20
negative_sample_handling: none
loss: cmalloss

optimizer: Adam
learning_rate: {0: 0.001, 25: 0.0005, 35: 0.0001}
clip_gradient_norm: 1
allow_subsequent_nan_losses: 10
batch_size: 256
epochs: 40
max_updates_per_epoch: 1000
num_workers: 3
seed: 42

validate_every: 10
save_weights_every: 1
log_interval: 50
log_tensorboard: false
verbose: 0
