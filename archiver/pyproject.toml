[project]
name = "flowcast-archiver"
version = "0.1.0"
description = "Archives NWS/NOAA benchmark forecasts (MARFC, HEFS, NWM, USGS temperature) for flowcast scoring"
requires-python = ">=3.12"
# pandas/pyarrow/numpy come from the AWS SDK for pandas layer in Lambda
# (see infra/lib/archiver-stack.ts); the rest is bundled with the function.
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "requests>=2.32",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]

[project.scripts]
flowcast-archiver = "flowcast_archiver.cli:main"

[dependency-groups]
dev = ["pytest>=8", "zstandard>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
