[project]
name = "flowcast-archiver"
version = "0.1.0"
description = "Archives NWS/NOAA benchmark forecasts (MARFC, HEFS, NWM, USGS temperature) for flowcast scoring"
requires-python = ">=3.12"
# In Lambda, boto3 comes from the runtime and pandas/pyarrow/numpy from the AWS SDK
# for pandas layer (see infra/lib/archiver-stack.ts); the rest is bundled with the function.
dependencies = [
    "boto3>=1.34",
    "flowcast-pipeline",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "requests>=2.32",
    # zoneinfo data for SHEF/USGS local times; the Lambda image has no system tz database
    "tzdata>=2024.1",
    "zstandard>=0.23",
]

[project.scripts]
flowcast-archiver = "flowcast_archiver.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
flowcast-pipeline = { path = "../pipeline", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
