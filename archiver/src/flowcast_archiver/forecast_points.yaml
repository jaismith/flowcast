# NWS forecast points and NWM reaches archived as benchmarks.
# lid: NWS location id (NWPS / HEFS / RVF bulletins). usgs: co-located USGS gauge.
# reach: NWM feature id from NWPS. hefs: whether the HEFS API publishes this point.
# kind: stage (river gauge, HG) or pool (reservoir elevation, HP; no rating).
