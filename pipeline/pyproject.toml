[project]
name = "flowcast-pipeline"
version = "0.1.0"
description = "flowcast v2 data pipeline: USGS Water Data API client, site registry, observation ingest"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.scripts]
flowcast-obs = "flowcast_pipeline.cli:main"
flowcast-dataset = "flowcast_pipeline.dataset.cli:main"

[project.optional-dependencies]
dataset = [
    "boto3>=1.35",
    "dask>=2025.1",
    "geopandas>=1.0",
    "icechunk>=1.0",
    "netcdf4>=1.7",
    "numcodecs>=0.15",
    "py7zr>=0.22",
    "pyproj>=3.6",
    "pystac>=1.10",
    "rasterio>=1.4",
    "s3fs>=2025.1",
    "scipy>=1.13",
    "shapely>=2.0",
    "xarray>=2025.1",
    "zarr>=3.0.8",
    "zstandard>=0.23",
]

[dependency-groups]
dev = ["pytest>=8", "responses>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowcast_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real USGS API (deselect with -m 'not live')"]
addopts = "-m 'not live'"
