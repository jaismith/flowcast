[project]
name = "flowcast-damsched"
version = "0.1.0"
description = "Prototype scrapers for published dam release schedules, with below-dam gauge checks (research, not deployed)"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "flowcast-pipeline",
    "geopandas>=1.0",
    "lxml>=5",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "pyarrow>=16",
    "remotezip>=0.12",
    "requests>=2.32",
]

[project.scripts]
flowcast-damsched = "flowcast_damsched.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
flowcast-pipeline = { path = "../../pipeline", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowcast_damsched"]

[tool.pytest.ini_options]
testpaths = ["tests"]
