[project]
name = "flowcast-eval"
version = "0.1.0"
description = "flowcast v2 evaluation harness: hindcast protocol, metrics, bootstrap CIs, reference baselines, scoreboards"
requires-python = ">=3.11"
dependencies = [
  "flowcast-pipeline",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "requests>=2.31",
  "scipy>=1.11",
  # NWM archives: NetCDF4/HDF5 over HTTP range requests, and the Zarr retrospective's zstd chunks.
  "aiohttp>=3.9",
  "fsspec>=2024.2",
  "h5py>=3.10",
  "numcodecs>=0.12",
]

[project.scripts]
flowcast-eval = "flowcast_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
flowcast-pipeline = { path = "../pipeline", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowcast_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
