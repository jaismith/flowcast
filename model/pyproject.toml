[project]
name = "flowcast-model"
version = "0.1.0"
description = "flowcast v2 streamflow model: NeuralHydrology multi-basin hourly forecast LSTM, streaming Zarr dataset, EC2 Spot training launcher"
requires-python = ">=3.11,<3.13"
dependencies = [
  "flowcast-eval",
  "flowcast-pipeline",
  "neuralhydrology==1.13.0",
  "torch>=2.4",
  "numpy>=1.26,<2.4",
  "pandas>=2.2,<3",
  "pyarrow>=15",
  "xarray>=2024.6",
  "zarr>=2.18",
  "numcodecs>=0.12",
  "netcdf4>=1.6",
  "pyyaml>=6",
  "requests>=2.31",
  "boto3>=1.34",
  "numba>=0.60",
]

[project.scripts]
flowcast-model = "flowcast_model.cli:main"
flowcast-train = "flowcast_model.launcher.cli:main"

[dependency-groups]
dev = ["pytest>=8", "moto[ec2,s3,iam,scheduler]>=5"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
flowcast-pipeline = { path = "../pipeline", editable = true }
flowcast-eval = { path = "../evaluation", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowcast_model"]

[tool.hatch.build.targets.wheel.force-include]
"src/flowcast_model/launcher/bootstrap.sh" = "flowcast_model/launcher/bootstrap.sh"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real public data services or AWS (deselect with -m 'not live')"]
addopts = "-m 'not live'"
