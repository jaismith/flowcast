# h256 residual (the best slice50 config, run s50-h256-resid) plus SNOW-17 snow-module features
# (flowcast_pipeline.snow LSTM_FEATURES: SWE, melt, rain+melt, rainfall/snowfall, snow cover, liquid water, cold content,
# depth, rain-on-snow, terrain shortwave, snow line, and SWE/rain+melt/cover per elevation band) in both branches.
# The features come from a second store (snow.zarr, built per basin): AORC-band-driven through 2020-08 and
# HRRR-analysis-driven from 2020-09 (real-time forcing, so operational hindcasts never use AORC), plus the forecast
# product `snowgefs`, SNOW-17 continued from the HRRR-driven state at each 00Z GEFS init with GEFS band forcing.
# Training uses the continuous snow series as the forecast (perfect prog, like AORC); operational hindcasts swap in
# `snowgefs` members alongside GEFS.
flowcast:
  dataset:
    cube: [/opt/flowcast/data/trainval.zarr]
    optional_inputs: [hrrr_an_precip_mm_h, hrrr_an_temp_2m_c, hrrr_an_dewpoint_2m_c, hrrr_an_pressure_kpa, hrrr_an_wind_speed_10m, hrrr_an_sw_down_wm2, hrrr_an_lw_down_wm2, mrms_precip_mm_h, qobs_mm_h_shift1, gauged_outflow_mm_h_shift1]
    group_dropout: {aorc_precip_mm_h: 0.3, qobs_mm_h_shift1: 0.5}
    block_basins: 64
    chunk_samples: 2048
  basins: all
  target: {unit: mm/h, area_attribute: area_km2}
  hindcast:
    issue_hours: [0, 6, 12, 18]
    start: "2020-10-01"
    # MARFC's WY2021-2022 bulletin times for Callicoon (from the forecast archive), so the model can be scored
    # head to head with MARFC at MARFC's own issue times
    extra_issues: configs/callicoon_marfc_issues_wy2021_2022.parquet
    n_samples: 4
    epoch: last
    modes:
      operational:
        suffix: ""
        run_type: operational
        mask_hindcast: [aorc_precip_mm_h, aorc_temp_2m_c, aorc_dewpoint_2m_c, aorc_pressure_kpa, aorc_wind_speed_10m, aorc_sw_down_wm2, aorc_lw_down_wm2, aorc_spfh_2m_gkg]
        substitute_forecast: {aorc_precip_mm_h: gefs_precip_mm_h, aorc_temp_2m_c: gefs_temp_2m_c, aorc_dewpoint_2m_c: gefs_dewpoint_2m_c, aorc_pressure_kpa: gefs_pressure_kpa, aorc_wind_speed_10m: gefs_wind_speed_10m, aorc_sw_down_wm2: gefs_sw_down_wm2, aorc_lw_down_wm2: gefs_lw_down_wm2, snow_swe: snowgefs_snow_swe, snow_melt: snowgefs_snow_melt, snow_rain_plus_melt: snowgefs_snow_rain_plus_melt, snow_rainfall: snowgefs_snow_rainfall, snow_snowfall: snowgefs_snow_snowfall, snow_cover_frac: snowgefs_snow_cover_frac, snow_liquid_water: snowgefs_snow_liquid_water, snow_cold_content: snowgefs_snow_cold_content, snow_depth: snowgefs_snow_depth, snow_ros_melt: snowgefs_snow_ros_melt, snow_ros_frac: snowgefs_snow_ros_frac, sw_terrain: snowgefs_sw_terrain, sw_clear_terrain: snowgefs_sw_clear_terrain, snow_line_elev: snowgefs_snow_line_elev, snow_swe_b1: snowgefs_snow_swe_b1, snow_swe_b2: snowgefs_snow_swe_b2, snow_swe_b3: snowgefs_snow_swe_b3, snow_swe_b4: snowgefs_snow_swe_b4, snow_rain_plus_melt_b1: snowgefs_snow_rain_plus_melt_b1, snow_rain_plus_melt_b2: snowgefs_snow_rain_plus_melt_b2, snow_rain_plus_melt_b3: snowgefs_snow_rain_plus_melt_b3, snow_rain_plus_melt_b4: snowgefs_snow_rain_plus_melt_b4, snow_cover_frac_b1: snowgefs_snow_cover_frac_b1, snow_cover_frac_b2: snowgefs_snow_cover_frac_b2, snow_cover_frac_b3: snowgefs_snow_cover_frac_b3, snow_cover_frac_b4: snowgefs_snow_cover_frac_b4}
        forecast_latency_h: {gefs_init: 6, snowgefs_init: 6}
        members: [0, 1, 2, 3, 4]
      perfect:
        suffix: _perfect
        run_type: perfect_forcing
  run_type: operational
  score: {enabled: true, n_boot: 300, workers: 6}
  model: {residual_from: qobs_mm_h_shift1}

experiment_name: lstm_s50_snow
dataset: flowcast_zarr

train_start_date: "01/10/2000"
train_end_date: "30/09/2019"
validation_start_date: "01/10/2019"
validation_end_date: "30/09/2022"
test_start_date: "01/10/2019"
test_end_date: "30/09/2022"

model: handoff_forecast_lstm
seq_length: 888
forecast_seq_length: 168
predict_last_n: 168
forecast_overlap: 0
hidden_size: 256
hindcast_hidden_size: 256
forecast_hidden_size: 256
state_handoff_network: {type: fc, hiddens: [256], activation: tanh, dropout: 0.0}
initial_forget_bias: 3
output_dropout: 0.3

dynamic_inputs: [aorc_precip_mm_h, aorc_temp_2m_c, aorc_dewpoint_2m_c, aorc_pressure_kpa, aorc_wind_speed_10m, aorc_sw_down_wm2, aorc_lw_down_wm2, aorc_spfh_2m_gkg, hrrr_an_precip_mm_h, hrrr_an_temp_2m_c, hrrr_an_dewpoint_2m_c, hrrr_an_pressure_kpa, hrrr_an_wind_speed_10m, hrrr_an_sw_down_wm2, hrrr_an_lw_down_wm2, mrms_precip_mm_h, qobs_mm_h_shift1, gauged_outflow_mm_h_shift1, snow_swe, snow_melt, snow_rain_plus_melt, snow_rainfall, snow_snowfall, snow_cover_frac, snow_liquid_water, snow_cold_content, snow_depth, snow_ros_melt, snow_ros_frac, sw_terrain, sw_clear_terrain, snow_line_elev, snow_swe_b1, snow_swe_b2, snow_swe_b3, snow_swe_b4, snow_rain_plus_melt_b1, snow_rain_plus_melt_b2, snow_rain_plus_melt_b3, snow_rain_plus_melt_b4, snow_cover_frac_b1, snow_cover_frac_b2, snow_cover_frac_b3, snow_cover_frac_b4]
hindcast_inputs:
  - [aorc_precip_mm_h, aorc_temp_2m_c, aorc_dewpoint_2m_c, aorc_pressure_kpa, aorc_wind_speed_10m, aorc_sw_down_wm2, aorc_lw_down_wm2, aorc_spfh_2m_gkg]
  - [hrrr_an_precip_mm_h, hrrr_an_temp_2m_c, hrrr_an_dewpoint_2m_c, hrrr_an_pressure_kpa, hrrr_an_wind_speed_10m, hrrr_an_sw_down_wm2]
  - [hrrr_an_lw_down_wm2]
  - [mrms_precip_mm_h]
  - [qobs_mm_h_shift1]
  - [gauged_outflow_mm_h_shift1]
  - [snow_swe, snow_melt, snow_rain_plus_melt, snow_rainfall, snow_snowfall, snow_cover_frac, snow_liquid_water, snow_cold_content, snow_depth, snow_ros_melt, snow_ros_frac, sw_terrain, sw_clear_terrain, snow_line_elev, snow_swe_b1, snow_swe_b2, snow_swe_b3, snow_swe_b4, snow_rain_plus_melt_b1, snow_rain_plus_melt_b2, snow_rain_plus_melt_b3, snow_rain_plus_melt_b4, snow_cover_frac_b1, snow_cover_frac_b2, snow_cover_frac_b3, snow_cover_frac_b4]
forecast_inputs:
  - [aorc_precip_mm_h, aorc_temp_2m_c, aorc_dewpoint_2m_c, aorc_pressure_kpa, aorc_wind_speed_10m, aorc_sw_down_wm2, aorc_lw_down_wm2]
  - [snow_swe, snow_melt, snow_rain_plus_melt, snow_rainfall, snow_snowfall, snow_cover_frac, snow_liquid_water, snow_cold_content, snow_depth, snow_ros_melt, snow_ros_frac, sw_terrain, sw_clear_terrain, snow_line_elev, snow_swe_b1, snow_swe_b2, snow_swe_b3, snow_swe_b4, snow_rain_plus_melt_b1, snow_rain_plus_melt_b2, snow_rain_plus_melt_b3, snow_rain_plus_melt_b4, snow_cover_frac_b1, snow_cover_frac_b2, snow_cover_frac_b3, snow_cover_frac_b4]
nan_handling_method: input_replacing
lagged_features: {qobs_mm_h: 1, gauged_outflow_mm_h: 1}
static_attributes: [log_area, lat, lon, elevation_m, slope_deg, northness, eastness, sky_view, p_mean, pet_mean, aridity, p_seasonality, frac_snow, high_prec_freq, high_prec_dur, low_prec_freq, low_prec_dur, t_mean, baseflow_index, forest_frac, developed_frac, runoff_mean_mm_yr, nid_n_dams, nid_n_major, nid_dam_density_per_1000km2, nid_normal_storage_mm, nid_dor_normal, nid_major_dor_normal, nid_largest_dor, nid_max_drainage_frac, below_dam, below_dam_drainage_frac, gauged_outflow_n, gauged_outflow_area_frac, ungauged_dor_normal, regulation_partly_observed]
target_variables: [qobs_mm_h]
clip_targets_to_zero: [qobs_mm_h]

head: cmal
n_distributions: 3
n_samples: 20
negative_sample_handling: clip
loss: cmalloss

optimizer: Adam
learning_rate: {0: 0.001, 20: 0.0005, 26: 0.0001}
clip_gradient_norm: 1
# CMAL masks samples with any missing target in the forecast window; a batch can end up fully masked (NaN loss).
# Skip such batches instead of stopping.
allow_subsequent_nan_losses: 10
batch_size: 256
epochs: 30
max_updates_per_epoch: 1000
num_workers: 3
seed: 42

validate_every: 3
save_weights_every: 1
log_interval: 50
log_tensorboard: false
verbose: 0
