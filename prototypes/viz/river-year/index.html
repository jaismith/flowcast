<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>River Year · flowcast viz</title>
    <style>
      body { overflow: hidden; background: radial-gradient(900px 700px at 42% 50%, #0e1a33, #04070e); }
      #stage { position: fixed; inset: 0; }
      #stage canvas, #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      #side { position: fixed; top: 80px; right: 14px; width: 300px; z-index: 20; display: grid; gap: 12px; }
      #side .num { font-size: 16px; }
      .legend { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
      .legend canvas { width: 150px; height: 8px; border-radius: 4px; }
      .month { font-size: 11px; fill: rgba(227, 235, 246, 0.6); letter-spacing: 0.1em; text-transform: uppercase; }
      .ring-label { font-size: 10px; fill: rgba(227, 235, 246, 0.45); }
      #years { max-height: 160px; overflow: auto; display: flex; flex-wrap: wrap; gap: 4px; }
      #years button { font-size: 11px; padding: 2px 6px; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="c"></canvas>
      <svg id="overlay"></svg>
    </div>
    <aside id="side">
      <div class="panel" style="display: grid; gap: 10px">
        <div class="controls">
          <button id="v-rings" class="active">Rings</button>
          <button id="v-spiral">Spiral</button>
          <button id="replay">↻ Replay year</button>
        </div>
        <div class="controls">
          <button id="m-q" class="active">Discharge</button>
          <button id="m-wt">Water temp</button>
        </div>
        <div class="legend" id="legend-row"><span id="lg-lo"></span><canvas id="legend" width="150" height="8"></canvas><span id="lg-hi"></span></div>
        <div style="color: var(--muted); font-size: 11.5px; line-height: 1.5" id="explain"></div>
      </div>
      <div class="panel" style="display: grid; gap: 8px">
        <div class="label">Hover readout</div>
        <div id="hover-date" style="font-weight: 600">Hover the chart</div>
        <div class="num" id="hover-val">–</div>
        <div id="hover-rank" style="color: var(--muted); font-size: 12px"></div>
      </div>
      <div class="panel">
        <div class="label" style="margin-bottom: 6px">Highlight a year</div>
        <div id="years"></div>
      </div>
    </aside>
    <script type="module" src="./main.js"></script>
  </body>
</html>
