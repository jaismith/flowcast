# h256 residual (the best slice50 config, run s50-h256-resid) plus travel-time zone forcings, hourly variant
# (training cube v1.3, docs/training-dataset.md): AORC precipitation (area fraction x zone mean) in 73 one-hour
# travel-time bins (0-1 ... 71-72 h, 72 h+) in the hindcast AORC group (masked in operational hindcasts, like all
# AORC inputs), with the width function (bin area fractions) and travel-time statistics as statics. Bins a basin
