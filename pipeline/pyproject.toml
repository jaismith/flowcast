[project]
name = "flowcast-pipeline"
version = "0.1.0"
description = "flowcast v2 data pipeline: USGS Water Data API client, site registry, observation ingest"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
snow = [
  "numba>=0.61",
  "xarray>=2024.6",
  "shapely>=2.0",
  "pillow>=10",
  "rasterio>=1.4",
]

[project.scripts]
flowcast-obs = "flowcast_pipeline.cli:main"
flowcast-snow = "flowcast_pipeline.snow.cli:main"
flowcast-snow-validate = "flowcast_pipeline.snow.validation:main"

[dependency-groups]
dev = ["pytest>=8", "responses>=0.25", "flowcast-pipeline[snow]"]
snow-validation = ["s3fs>=2024.6", "zarr>=3", "matplotlib>=3.8", "scipy>=1.13", "tabulate>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowcast_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real USGS API (deselect with -m 'not live')"]
addopts = "-m 'not live'"
