[project]
name = "flowcast-pipeline"
version = "0.1.0"
description = "flowcast v2 data pipeline: USGS Water Data API client, site registry, observation ingest"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.scripts]
flowcast-obs = "flowcast_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8", "responses>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowcast_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real USGS API (deselect with -m 'not live')"]
addopts = "-m 'not live'"
